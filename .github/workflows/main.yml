
name: Flagship DevOps CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  flagship-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and Test
        run: gradle clean build

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: flagship-jar
          path: build/libs/*.jar

      
      - name: Build Docker image
        run: docker build -t flagship-app:1.0 .

      - name: Check Docker image
        run: docker image inspect flagship-app:1.0

      - name: Run Docker container
        run: |
          docker run -d --name flagship-test -p 8080:8080 flagship-app:1.0
          sleep 20
          docker logs flagship-test
          docker ps -a
          docker inspect -f '{{.State.Running}}' flagship-test | grep true
          echo "Testing application HTTP endpoint"
          curl --fail --retry 5 --retry-delay 3 --retry-connrefused http://localhost:8080/

