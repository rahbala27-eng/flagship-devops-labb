
name: Flagship DevOps CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  flagship-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and Test
        run: gradle clean build

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: flagship-jar
          path: build/libs/*.jar

      - name: Deploy to Development
        run: echo "Development deployment not configured yet"
